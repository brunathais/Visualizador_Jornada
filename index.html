<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKA TechHub - Projetos Finais</title>

    <style>
        :root {
            --primary: #0678B6;
            --primary-light: #048DCC;
            --primary-dark: #05588C;
            --navy: #133756;
            --accent: #FF8F1C;

            --background: #133756;
            --surface: #05588C;
            --text: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.82);
            --border: #048DCC;

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;

            --shadow: 0 5px 18px rgba(19, 55, 86, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        header {
            background: var(--primary-dark);
            color: white;
            text-align: center;
            padding: 28px 20px 24px;
            border-bottom: 4px solid var(--accent);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            letter-spacing: 2px;
            font-weight: 800;
        }

        h1 span {
            color: var(--accent);
        }

        h2 {
            margin: 0;
            font-size: 18px;
            font-weight: normal;
            color: var(--text-muted);
        }

        .subtitulo {
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            margin: 26px 16px 0;
            line-height: 1.5;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            align-content: flex-start;
            flex-wrap: wrap;
            gap: 24px;
            padding: 28px 24px 36px;
            flex: 1;
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
        }

        .coluna {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px;
            flex: 1 1 320px;
            width: auto;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .coluna:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 24px rgba(19, 55, 86, 0.42);
        }

        .coluna h3 {
            width: 100%;
            margin: 0 0 18px;
            padding: 12px 10px;
            background: var(--primary-light);
            color: white;
            border-radius: var(--radius-md);
            border-left: 4px solid var(--accent);
            text-align: center;
            font-size: 15px;
            line-height: 1.4;
        }

        .grade {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
        }

        .projeto {
            min-width: 0;
            padding: 9px;
            background: var(--accent);
            border: 1px solid rgba(4, 141, 204, 0.55);
            border-radius: var(--radius-md);
            text-align: center;
            color: white;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.4;
            overflow-wrap: anywhere;
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .projeto:hover {
            background: var(--primary-light);
            border-color: var(--accent);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(255, 143, 28, 0.2);
        }

        .projeto a {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .projeto a:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
            border-radius: var(--radius-sm);
        }

        .projeto:focus-within {
            border-color: var(--accent);
        }

        .thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 9px;
            background-color: var(--navy);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: var(--radius-sm);
            overflow: hidden;
        }

        .projeto a:hover .thumb {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        footer {
            margin-top: auto;
            width: 100%;
            padding: 20px;
            background: var(--navy);
            border-top: 3px solid var(--primary);
            color: var(--text-muted);
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
        }

        footer span {
            color: var(--accent);
            font-weight: bold;
        }

        @media (max-width: 700px) {
            header {
                padding: 24px 14px 20px;
            }

            h1 {
                font-size: 25px;
            }

            h2 {
                font-size: 16px;
            }

            .container {
                padding: 22px 14px 30px;
                gap: 18px;
            }

            .coluna {
                width: 100%;
                max-width: 420px;
                flex: 1 1 100%;
            }

            .grade {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .subtitulo {
                margin-top: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }

        /* Detalhes do projeto exibidos na mesma página */
        .projeto { cursor: pointer; }
        .projeto button { all: unset; display:block; width:100%; cursor:pointer; color:inherit; }
        .projeto button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:var(--radius-sm); }
        .modal-backdrop { position:fixed; inset:0; z-index:1000; background:rgba(3,18,31,.82); display:none; overflow-y:auto; padding:24px; }
        .modal-backdrop.aberto { display:flex; align-items:flex-start; justify-content:center; }
        .detalhe-modal { width:min(100%,1000px); margin:auto; background:var(--background); color:var(--text); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:0 18px 60px rgba(0,0,0,.45); overflow:hidden; }
        .modal-topo { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; background:var(--primary-dark); border-bottom:3px solid var(--accent); }
        .modal-topo h2 { color:white; font-size:20px; font-weight:bold; }
        .fechar-modal { border:0; border-radius:8px; padding:8px 12px; background:var(--accent); color:white; font-size:20px; cursor:pointer; }
        .detalhe-corpo { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(240px,1fr); gap:22px; padding:22px; }
        .jogo-area { min-width:0; }
        .jogo-preview { width:100%; aspect-ratio:16/9; object-fit:contain; background:#09243a; border-radius:10px; border:1px solid var(--border); }
        .jogo-placeholder { display:flex; min-height:220px; aspect-ratio:16/9; align-items:center; justify-content:center; text-align:center; padding:20px; background:#09243a; border-radius:10px; color:var(--text-muted); }
        .acoes-jogo { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
        .acao-jogo { display:inline-block; padding:10px 14px; border-radius:8px; background:var(--accent); color:white; font-weight:bold; text-decoration:none; }
        .acao-jogo.secundaria { background:var(--primary-light); }
        .grupo-foto { width:100%; max-height:320px; object-fit:contain; background:#09243a; border-radius:10px; }
        .sem-foto { display:flex; min-height:180px; align-items:center; justify-content:center; text-align:center; padding:16px; border:1px dashed var(--border); border-radius:10px; color:var(--text-muted); }
        .info-grupo { line-height:1.6; }
        .info-grupo h3 { margin:16px 0 6px; color:var(--accent); }
        .info-grupo p { margin:0 0 10px; }
        .modal-descricao { color:var(--text-muted); line-height:1.6; }
        @media (max-width:700px) { .modal-backdrop { padding:10px; } .detalhe-corpo { grid-template-columns:1fr; padding:15px; } .modal-topo { padding:14px; } .modal-topo h2 { font-size:17px; } }

    </style>
</head>

<body>

    <header>
        <h1>SKA <span>TECH</span>hub</h1>
        <h2>4ª Jornada Tecnológica – Projetos Finais</h2>
    </header>

    <p class="subtitulo">
        Selecione um projeto para ver os integrantes, a turma, a foto e o jogo sem abrir outra guia.
    </p>

    <main class="container" id="lista-projetos" aria-label="Lista de projetos"></main>

    <footer>
        <span>SKA TECHhub</span> · 4ª Jornada Tecnológica<br>
        Mantenha este arquivo HTML junto das pastas <strong>imagens</strong> e <strong>jogos</strong>.
    </footer>

    <div class="modal-backdrop" id="modal-projeto" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <section class="detalhe-modal">
            <div class="modal-topo">
                <h2 id="modal-titulo">Detalhes do projeto</h2>
                <button class="fechar-modal" id="fechar-modal" type="button" aria-label="Fechar detalhes">×</button>
            </div>
            <div class="detalhe-corpo">
                <section class="jogo-area">
                    <div id="area-jogo"></div>
                    <h3 id="titulo-jogo"></h3>
                    <p class="modal-descricao" id="descricao-jogo"></p>
                    <div class="acoes-jogo" id="acoes-jogo"></div>
                </section>
                <aside class="info-grupo">
                    <div id="area-foto"></div>
                    <h3>Integrantes</h3><p id="integrantes"></p>
                    <h3>Turma</h3><p id="turma"></p>
                </aside>
            </div>
        </section>
    </div>

    <script>

    ].map(p => ({

      titulo: 'Projeto de ' + p.integrantes,

      foto: 'imagens/' + p.slug + '.jpg',
      preview: 'imagens/' + p.slug + '-preview.png',
      jogo: 'jogos/' + p.slug + '.sb3',
      scratchUrl: '' // Exemplo: 'https://scratch.mit.edu/projects/123456789/'
    }));

    const lista = document.getElementById('lista-projetos');
    const modal = document.getElementById('modal-projeto');
    const escapeHtml = valor => String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const turmas = [
      { id:'T1', titulo:'T1 – Quinta-feira / Manhã' },
      { id:'T2', titulo:'T2 – Quinta-feira / Tarde' },
      { id:'T3', titulo:'T3 – Sábado / Manhã' }
    ];

    function renderizarLista() {
      lista.innerHTML = turmas.map(t => {
        const cards = projetos.filter(p => p.turmaId === t.id).map((p, i) => `
          <div class="projeto"><button type="button" data-slug="${escapeHtml(p.slug)}" aria-label="Ver projeto de ${escapeHtml(p.integrantes)}">
            <div class="thumb" style="background-image:url('imagens/preview-pendente.svg')" aria-hidden="true"></div>
            ${escapeHtml(p.integrantes)}
          </button></div>`).join('');
        return `<section class="coluna"><h3>${escapeHtml(t.titulo)}</h3><div class="grade">${cards}</div></section>`;
      }).join('');
      lista.querySelectorAll('[data-slug]').forEach(btn => btn.addEventListener('click', () => abrirProjeto(btn.dataset.slug)));
    }

    function abrirProjeto(slug) {
      const p = projetos.find(item => item.slug === slug);
      if (!p) return;
      document.getElementById('modal-titulo').textContent = p.integrantes;
      document.getElementById('titulo-jogo').textContent = p.titulo;
      document.getElementById('descricao-jogo').textContent = p.descricao;
      document.getElementById('integrantes').textContent = p.integrantes;
      document.getElementById('turma').textContent = p.turma;

      const areaJogo = document.getElementById('area-jogo');
      areaJogo.innerHTML = p.scratchUrl
        ? `<iframe class="jogo-preview" src="${escapeHtml(p.scratchUrl.replace('https://scratch.mit.edu/projects/', 'https://scratch.mit.edu/projects/embed/').replace(/\/$/, ''))}" title="Jogo Scratch de ${escapeHtml(p.integrantes)}" allowtransparency="true" allowfullscreen></iframe>`
        : `<div class="jogo-placeholder">O jogo aparecerá aqui quando você cadastrar o link público do Scratch.<br><br>O arquivo .sb3 pode ser aberto ou importado no editor Scratch.</div>`;

      document.getElementById('area-foto').innerHTML = `<img class="grupo-foto" src="${escapeHtml(p.foto)}" alt="Foto de ${escapeHtml(p.integrantes)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="sem-foto" style="display:none">Adicione a foto do grupo em:<br>${escapeHtml(p.foto)}</div>`;
      const acoes = document.getElementById('acoes-jogo');
      acoes.innerHTML = `<a class="acao-jogo" href="${escapeHtml(p.jogo)}" download>Baixar arquivo .sb3</a>` + (p.scratchUrl ? `<a class="acao-jogo secundaria" href="${escapeHtml(p.scratchUrl)}" target="_blank" rel="noopener">Abrir no Scratch</a>` : `<a class="acao-jogo secundaria" href="https://scratch.mit.edu/" target="_blank" rel="noopener">Abrir editor Scratch</a>`);
      modal.classList.add('aberto');
      document.body.style.overflow = 'hidden';
      document.getElementById('fechar-modal').focus();
    }
    function fecharProjeto() { modal.classList.remove('aberto'); document.body.style.overflow = ''; }
    document.getElementById('fechar-modal').addEventListener('click', fecharProjeto);
    modal.addEventListener('click', e => { if (e.target === modal) fecharProjeto(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('aberto')) fecharProjeto(); });
    renderizarLista();
    </script>
